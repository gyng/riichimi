name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build web client
        run: npm run build:web
        env:
          # The repository name is the path the site is served from. Vite's base
          # needs the trailing slash so asset URLs and the router basename align.
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: Serve unknown paths through the SPA entry
        # GitHub Pages returns 404.html for any path with no matching file. Serving
        # the SPA shell there lets react-router resolve client-side deep links.
        run: cp apps/client/dist/index.html apps/client/dist/404.html
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
