version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Do not propose a version until it has been published for at least seven
    # days. A just-published release is where a compromised package shows up, and
    # the wait costs nothing on a hobby cadence.
    cooldown:
      default-days: 7
    groups:
      # React refuses to run if these two versions differ, so a lone bump of
      # either is red by construction. They are grouped rather than ignored:
      # ignoring them was an Expo-era necessity, a group lets them move.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      oxc:
        patterns:
          - "oxlint*"
          - "oxfmt"
      tests:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "jsdom"
    versioning-strategy: increase
