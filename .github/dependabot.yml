version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Do not propose a version until it has been published for at least seven
    # days. A just-published release is where a compromised package shows up, and
    # the wait costs nothing on a hobby cadence.
    cooldown:
      default-days: 7
    groups:
      # The four expo-* packages left are aliased to web shims and move together.
      expo:
        patterns:
          - "expo*"
          - "@expo/*"
      oxc:
        patterns:
          - "oxlint*"
          - "oxfmt"
      tests:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "jsdom"
    versioning-strategy: increase
