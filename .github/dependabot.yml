version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      expo:
        patterns:
          - "expo*"
          - "@expo/*"
          - "react-native*"
      oxc:
        patterns:
          - "oxlint*"
          - "oxfmt"
      tests:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "jest*"
          - "@testing-library/*"
    versioning-strategy: increase
